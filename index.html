<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>執筆・論考アーカイブ | 無限の注釈</title>
    <style>
        :root {
            --bg: #fdfdfd;
            --text: #080808;
            --muted: #666666;
            --border: #cccccc;
            --highlight: #e8e8e8;
            --max-width: 680px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "游明朝", YuMincho, "ヒラギノ明朝 ProN W3", "Hiragino Mincho ProN", "Times New Roman", serif;
            color: var(--text);
            background-color: var(--bg);
            line-height: 2.2;
            letter-spacing: 0.05em;
            font-size: 15px;
            padding: 6rem 2rem 15rem;
        }

        main {
            max-width: var(--max-width);
            margin: 0 auto;
        }

        .canto-title {
            font-size: 1.2rem;
            font-weight: normal;
            margin-bottom: 2rem;
            letter-spacing: 0.1em;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        p {
            margin-bottom: 1.5rem;
            text-align: justify;
        }

        /* 偏執狂的ネットワークを形成するリンク */
        .node-link {
            cursor: pointer;
            border-bottom: 1px solid var(--text);
            transition: background-color 0.2s ease;
        }

        .node-link:hover {
            background-color: var(--highlight);
        }

        .node-link.expanded {
            color: var(--muted);
            border-bottom: none;
            cursor: default;
            background-color: transparent;
        }

        /* 注釈（Scholium）のスタイル */
        .scholium-container {
            border-left: 1px solid var(--border);
            padding-left: 2rem;
            margin-top: 1.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: var(--text);
            opacity: 0;
            transition: opacity 1s ease;
        }

        .scholium-container.active {
            opacity: 1;
        }

        .scholium-header {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.65rem;
            color: var(--muted);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        /* 生成中の静寂なローディング表示（俗なアニメーションの排除） */
        .thinking {
            color: var(--muted);
            font-style: italic;
            font-size: 0.85rem;
            margin-top: 1rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <main id="manuscript">
        <h2 class="canto-title">不在としての戦争：小津安二郎と沈黙の構造</h2>
        <p>
            小津安二郎の後期作品には、画面に直接描かれない「大きな出来事」の影が重たく沈殿している。徹底して抑制された美的形式の背後にこそ、語られない記憶が<span class="node-link" onclick="expandScholium(this, '不在の形式')">不在の形式</span>として刻印されているのだ。家族の崩壊は、歴史の断絶を潜り抜けた日本人が直面せざるを得なかった集団的喪失の<span class="node-link" onclick="expandScholium(this, 'メタファー')">メタファー</span>にほかならない。
        </p>
    </main>

    <script>
        // 階層の深さ（パラノイアの進行度）を記録
        let currentDepth = 0;

        /**
         * リンクがクリックされた際に呼び出される中核関数
         */
        async function expandScholium(element, keyword) {
            if (element.classList.contains('expanded')) return;

            // リンクを非活性化（二重クリック防止）
            element.classList.add('expanded');
            currentDepth++;

            // 親要素の特定
            let target = element;
            while (target && target.tagName !== 'P' && !target.classList.contains('scholium-text')) {
                target = target.parentNode;
            }

            // 静謐な「思考中」表示
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'thinking';
            thinkingDiv.textContent = '...';
            target.parentNode.insertBefore(thinkingDiv, target.nextSibling);

            // AI（またはシミュレータ）からのテキスト生成
            const rawText = await fetchAIResponse(keyword, currentDepth);

            // 生成されたテキスト内の [[単語]] を新たなクリック可能リンクに置換
            const parsedText = parseBracketsToLinks(rawText);

            // 注釈ブロックの生成と挿入
            const scholiumDiv = document.createElement('div');
            scholiumDiv.className = 'scholium-container';
            scholiumDiv.innerHTML = `
                <div class="scholium-header">Scholium on "${keyword}"</div>
                <div class="scholium-text"><p>${parsedText}</p></div>
            `;

            // 思考中表示を削除し、注釈を挿入
            thinkingDiv.remove();
            target.parentNode.insertBefore(scholiumDiv, target.nextSibling);

            // 静寂な出現（フェードイン）
            setTimeout(() => {
                scholiumDiv.classList.add('active');
            }, 50);
        }

        /**
         * [[単語]] を <span class="node-link">単語</span> にパースする関数
         */
        function parseBracketsToLinks(text) {
            const regex = /\[\[(.*?)\]\]/g;
            return text.replace(regex, (match, p1) => {
                return `<span class="node-link" onclick="expandScholium(this, '${p1}')">${p1}</span>`;
            });
        }

        /**
         * LLM APIへのリクエスト関数（無限の生成エンジン）
         * ※真の無限生成を行う場合は、ここにOpenAI API等のリクエスト処理を記述します。
         */
        async function fetchAIResponse(keyword, depth) {
            /* 
             * 【真の無限のためのAPI実装例】
             * const response = await fetch('https://api.openai.com/v1/chat/completions', {
             *     method: 'POST',
             *     headers: {
             *         'Content-Type': 'application/json',
             *         'Authorization': 'Bearer YOUR_API_KEY'
             *     },
             *     body: JSON.stringify({
             *         model: "gpt-4o",
             *         messages: [
             *             { role: "system", content: "あなたは極めて知的だが、盗用と監視の被害妄想に囚われた編者である。学術的なトーンを崩さず、次第に狂気と私怨を交えよ。必ず次に展開させたい重要な名詞を2つ選び、[[単語]] のように二重括弧で囲むこと。150文字程度。" },
             *             { role: "user", content: `対象キーワード: ${keyword} / 現在の妄想深度: ${depth}` }
             *         ]
             *     })
             * });
             * const data = await response.json();
             * return data.choices[0].message.content;
             */

            // ※以下はAPIがない環境でも無限展開を体験するための、擬似的な自己再帰生成ロジックです。
            return simulateInfiniteParanoia(keyword, depth);
        }

        // ---------------------------------------------------------
        // 以下、APIキーなしで無限の狂気をシミュレートするフォールバック・エンジン
        // ---------------------------------------------------------
        function simulateInfiniteParanoia(keyword, depth) {
            return new Promise(resolve => {
                setTimeout(() => {
                    const theories = [
                        "エクリチュールの零度", "ミニマリズムの裂け目", "映像の単一の運動", "ハビトゥスの忘却", "記憶の事後性"
                    ];
                    const paranoias = [
                        "私の失われた手稿", "監視者の足音", "あの日彼が盗んだノート", "私の存在を抹消しようとするシステム", "ゼムブラの幻影"
                    ];
                    
                    // 深度が深くなるほど、学術的語彙よりパラノイア的語彙が優先してリンク化される
                    const t1 = theories[Math.floor(Math.random() * theories.length)];
                    const p1 = paranoias[Math.floor(Math.random() * paranoias.length)];

                    let responseText = "";
                    if (depth === 1) {
                        responseText = `「${keyword}」という概念について、C.K.はかつて自らの論文で言及したが、それは完全なる誤読である。彼が指摘したような構造的欠落は存在しない。真の問題は、それが[[${t1}]]を隠蔽するための巧妙なすり替えであるという点にある。彼は私が書いた[[${p1}]]の存在から目を逸らさせるために、この語を用いたのだ。`;
                    } else if (depth < 5) {
                        responseText = `${keyword}。この言葉を記述するたびに、私は彼が背後から私のタイプライターを覗き込んでいるような錯覚に陥る。学術的な装いはもはや意味をなさない。[[${t1}]]と彼が呼ぶものは、実際には私の人生の略奪に過ぎないのだ。なぜ誰もこの[[${p1}]]に気づかないのか。`;
                    } else {
                        responseText = `もはや${keyword}の定義などどうでもいい。重要なのは、彼らが私を完全に孤立させようとしている事実だけだ。テキストの背後には常に[[${p1}]]が張り巡らされており、私がこうして注釈を書き足すことすら、彼らの[[${t1}]]の一部として計算されているのかもしれない。私は逃げなければならない。`;
                    }
                    resolve(responseText);
                }, 800); // 思考時間（0.8秒）をシミュレート
            });
        }
    </script>

</body>
</html>
