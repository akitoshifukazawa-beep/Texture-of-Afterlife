<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>不在のアーカイブ</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #111111;
            --border: #cccccc;
            --max-width: 680px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "游明朝", YuMincho, "ヒラギノ明朝 ProN W3", "Hiragino Mincho ProN", "Times New Roman", serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 4rem 2rem;
            letter-spacing: 0.05em;
            line-height: 2.4;
        }

        .container {
            width: 100%;
            max-width: var(--max-width);
        }

        #input-view {
            text-align: center;
            padding: 10rem 0;
        }

        .seed-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            font-family: inherit;
            font-size: 1.1rem;
            color: var(--text);
            text-align: center;
            padding: 0.5rem 0;
            outline: none;
            transition: border-color 0.4s ease;
        }

        .seed-input:focus {
            border-bottom-color: var(--text);
        }

        .seed-input::placeholder {
            color: transparent;
        }

        #essay-view {
            display: none;
            text-align: justify;
        }

        .essay-body {
            font-size: 1rem;
            color: var(--text);
            margin-bottom: 4rem;
        }

        .colophon {
            border-top: 1px solid var(--border);
            padding-top: 1.5rem;
            font-size: 0.75rem;
            color: #777777;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <main class="container">
        <div id="input-view">
            <input type="text" id="seedInput" class="seed-input" autofocus autocomplete="off" spellcheck="false">
        </div>

        <div id="essay-view">
            <div id="essayContent" class="essay-body"></div>
            <footer class="colophon">
                <p>Synthesized by Human Intent & Machine Architecture</p>
            </footer>
        </div>
    </main>

    <script>
        const inputView = document.getElementById('input-view');
        const essayView = document.getElementById('essay-view');
        const seedInput = document.getElementById('seedInput');
        const essayContent = document.getElementById('essayContent');

        seedInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const seed = seedInput.value.trim();
                if (seed.length > 0) {
                    inputView.style.display = 'none';
                    essayContent.innerHTML = `<p>「${seed}」という断片が孕む構造的裂け目を起点として、映像の静止性とエクリチュールの零度が交差する。不可逆的な時間の流れのなかで、表象は常に一つの不在を指し示し続けている。</p>`;
                    essayView.style.display = 'block';
                }
            }
        });
    </script>

</body>
</html>
