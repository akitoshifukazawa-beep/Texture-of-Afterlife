<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Archive: テキスト解読エンジン</title>
    <style>
        :root {
            --bg: #f9f9f8;
            --text: #1a1a1a;
            --muted: #777;
            --border: #dcdcdc;
            --quote-bg: #f0f0ec;
        }

        body {
            font-family: "游明朝", YuMincho, "ヒラギノ明朝 ProN W3", "Hiragino Mincho ProN", serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 2.2;
            letter-spacing: 0.05em;
            margin: 0;
            padding: 5rem 2rem 10rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 750px;
        }

        .header-box {
            margin-bottom: 3rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--text);
        }

        .trigger-btn {
            background: none;
            border: 1px solid var(--text);
            padding: 0.8rem 1.5rem;
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.1em;
        }

        .trigger-btn:hover {
            background-color: var(--text);
            color: var(--bg);
        }

        .scholia-container {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .scholium {
            border-left: 2px solid var(--text);
            padding-left: 1.5rem;
            font-size: 0.95rem;
            animation: fadeIn 0.4s ease forwards;
        }

        .scholium-header {
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .fetched-quote {
            background-color: var(--quote-bg);
            padding: 0.8rem 1.2rem;
            font-size: 0.85rem;
            color: #444;
            margin: 0.8rem 0;
            border-left: 3px solid var(--muted);
        }

        .interpretation {
            margin-top: 0.8rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-box">
            <h2>自動テキスト読解装置</h2>
            <p>ボタンを押すたびに無作為な外部テキストを挿入し、その背景にある記述構造を解読します。</p>
            <button class="trigger-btn" id="fetch-btn" onclick="fetchAndInterpret()">外部テキストを取得・解読</button>
        </div>

        <div class="scholia-container" id="scholia-box"></div>
    </div>

    <script>
        let count = 1;

        // 特定作品に依存しない、汎用的な過剰解釈（解読）テンプレート
        const interpretTemplates = [
            (title, snippet) => `一見すると「${title}」に関する無害な記述に見える。しかし、${snippet} という一節において決定的な文脈の切断が行われている。表面上の事実に意識を向けさせ、記録の根幹から目を逸らさせるための過剰な記述に過ぎない。`,
            (title, snippet) => `拾い上げられた「${title}」というテキストの裏には、${snippet} という形で別の意図が潜んでいる。この記述が提示されたこと自体、元のアレゴリーが改変された証拠である。`,
            (title, snippet) => `「${title}」という言葉（― ${snippet}）がこのタイミングで抽出されたのは偶然ではない。検索およびアーカイブのアルゴリズム自体が、特定の記録を隠蔽するように操作されている。`,
            (title, snippet) => `『${title}』をめぐる言説の中で語られる ${snippet} という部分は、先行する記述を意図的に上書きした痕跡である。客観的データという形式を借りた言論の再構築に他ならない。`
        ];

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        async function fetchAndInterpret() {
            const btn = document.getElementById('fetch-btn');
            btn.disabled = true;
            btn.innerText = "テキスト取得中...";

            try {
                // Wikipedia API等からランダムな概要を取得
                const response = await fetch('https://ja.wikipedia.org/api/rest_v1/page/random/summary');
                const data = await response.json();

                const title = data.title;
                const extract = data.extract ? data.extract.substring(0, 90) + "…" : "（テキストの抽出に失敗）";

                const templateFn = getRandom(interpretTemplates);
                const resultText = templateFn(title, extract);

                const scholiumDiv = document.createElement('div');
                scholiumDiv.className = 'scholium';
                scholiumDiv.innerHTML = `
                    <div class="scholium-header">Record #${count} [Source: ${title}]</div>
                    <div class="fetched-quote">
                        <strong>引用箇所：</strong>「${extract}」
                    </div>
                    <div class="interpretation">
                        <strong>解読：</strong>${resultText}
                    </div>
                `;

                document.getElementById('scholia-box').appendChild(scholiumDiv);
                count++;

                window.scrollTo({
                    top: document.body.scrollHeight,
                    behavior: 'smooth'
                });

            } catch (error) {
                console.error("Fetch Error:", error);
            } finally {
                btn.disabled = false;
                btn.innerText = "外部テキストを取得・解読";
            }
        }
    </script>
</body>
</html>
