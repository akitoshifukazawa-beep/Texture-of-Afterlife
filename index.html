<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Archive: テキスト解読エンジン</title>
    <style>
        :root {
            --bg: #f9f9f8;
            --text: #1a1a1a;
            --muted: #777;
            --border: #dcdcdc;
            --quote-bg: #f0f0ec;
        }

        body {
            font-family: "游明朝", YuMincho, "ヒラギノ明朝 ProN W3", "Hiragino Mincho ProN", serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 2.2;
            letter-spacing: 0.05em;
            margin: 0;
            padding: 5rem 2rem 10rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 750px;
        }

        .header-box {
            margin-bottom: 3rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--text);
        }

        .trigger-btn {
            background: none;
            border: 1px solid var(--text);
            padding: 0.8rem 1.5rem;
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.1em;
        }

        .trigger-btn:hover {
            background-color: var(--text);
            color: var(--bg);
        }

        .scholia-container {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .scholium {
            border-left: 2px solid var(--text);
            padding-left: 1.5rem;
            font-size: 0.95rem;
            animation: fadeIn 0.4s ease forwards;
        }

        .scholium-header {
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .fetched-quote {
            background-color: var(--quote-bg);
            padding: 0.8rem 1.2rem;
            font-size: 0.85rem;
            color: #444;
            margin: 0.8rem 0;
            border-left: 3px solid var(--muted);
        }

        .interpretation {
            margin-top: 0.8rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-box">
            <h2>自動テキスト読解装置</h2>
            <p>ボタンを押すたびに無作為な外部テキストを挿入し、その背景にある記述構造を解読します。</p>
            <button class="trigger-btn" id="fetch-btn" onclick="fetchAndInterpret()">外部テキストを取得・解読</button>
        </div>

        <div class="scholia-container" id="scholia-box"></div>
    </div>

    <script>
        let count = 1;

        // 任意の文章が入っても文法が崩れない解読テンプレート
        const interpretTemplates = [
            (title, snippet) => `「${title}」の記録において、『${snippet}』と言及されている点に注目されたい。一見すると中立的な事実の記述に見えるが、この特定の文脈のみを選択して提示すること自体が、背後にある別の歴史を覆い隠すための操作である。`,
            (title, snippet) => `テキスト内では『${snippet}』と主張されている。しかし、このような客観性を装った記述を置くことで、本来語られるべきであった別の事象から読者の意識を逸らそうとする意図が示されている。`,
            (title, snippet) => `「${title}」に関する『${snippet}』という記述は、単なる情報の記録ではない。先行する記録を意図的に置き換え、読者の認識を特定の枠組みに固定化させるための構造的な配置である。`,
            (title, snippet) => `『${snippet}』という形で事実が断定されているが、この言説が構成されたプロセスそのものに疑いを向ける必要がある。語られた言葉の背後で、何が切り捨てられ沈黙させられたかを見極めなければならない。`
        ];

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        async function fetchAndInterpret() {
            const btn = document.getElementById('fetch-btn');
            btn.disabled = true;
            btn.innerText = "テキスト取得中...";

            try {
                const response = await fetch('https://ja.wikipedia.org/api/rest_v1/page/random/summary');
                const data = await response.json();

                const title = data.title;
                // 引用文の末尾を適切に処理
                let extract = data.extract ? data.extract.substring(0, 80).trim() : "";
                if (extract && !extract.endsWith('。')) {
                    extract += "…";
                }

                const templateFn = getRandom(interpretTemplates);
                const resultText = templateFn(title, extract);

                const scholiumDiv = document.createElement('div');
                scholiumDiv.className = 'scholium';
                scholiumDiv.innerHTML = `
                    <div class="scholium-header">Record #${count} [Source: ${title}]</div>
                    <div class="fetched-quote">
                        <strong>引用箇所：</strong>「${extract}」
                    </div>
                    <div class="interpretation">
                        <strong>解読：</strong>${resultText}
                    </div>
                `;

                document.getElementById('scholia-box').appendChild(scholiumDiv);
                count++;

                window.scrollTo({
                    top: document.body.scrollHeight,
                    behavior: 'smooth'
                });

            } catch (error) {
                console.error("Fetch Error:", error);
            } finally {
                btn.disabled = false;
                btn.innerText = "外部テキストを取得・解読";
            }
        }
    </script>
</body>
</html>
