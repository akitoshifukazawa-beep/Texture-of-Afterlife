<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Archive: 構文解析型テキスト解読エンジン</title>
    <style>
        :root {
            --bg: #f9f9f8;
            --text: #1a1a1a;
            --muted: #777;
            --border: #dcdcdc;
            --quote-bg: #f0f0ec;
        }

        body {
            font-family: "游明朝", YuMincho, "ヒラギノ明朝 ProN W3", "Hiragino Mincho ProN", serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 2.2;
            letter-spacing: 0.05em;
            margin: 0;
            padding: 5rem 2rem 10rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 750px;
        }

        .header-box {
            margin-bottom: 3rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--text);
        }

        .trigger-btn {
            background: none;
            border: 1px solid var(--text);
            padding: 0.8rem 1.5rem;
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.1em;
        }

        .trigger-btn:hover {
            background-color: var(--text);
            color: var(--bg);
        }

        .scholia-container {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .scholium {
            border-left: 2px solid var(--text);
            padding-left: 1.5rem;
            font-size: 0.95rem;
            animation: fadeIn 0.4s ease forwards;
        }

        .scholium-header {
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .fetched-quote {
            background-color: var(--quote-bg);
            padding: 0.8rem 1.2rem;
            font-size: 0.85rem;
            color: #444;
            margin: 0.8rem 0;
            border-left: 3px solid var(--muted);
        }

        .analysis-debug {
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 0.4rem;
        }

        .interpretation {
            margin-top: 0.8rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-box">
            <h2>自律解析型テキスト解読装置</h2>
            <p>無作為な外部テキストを取得し、内部NLPアルゴリズムで文脈要素を分解・再構築した解読文を生成します。</p>
            <button class="trigger-btn" id="fetch-btn" onclick="fetchAndInterpret()">外部テキストを取得・解析</button>
        </div>

        <div class="scholia-container" id="scholia-box"></div>
    </div>

    <script>
        let count = 1;

        // -------------------------------------------------------------
        // 軽量文法解析エンジン (Micro-NLP Engine for In-Browser JS)
        // -------------------------------------------------------------
        function parseGrammar(title, rawText) {
            if (!rawText) {
                return { topic: title, predicate: "詳細不明の記述", mainSentence: title };
            }

            // 1. 文の分割（最初の完全な一文を取得）
            const sentences = rawText.split(/(?<=[。！？])\s*/).filter(s => s.length > 5);
            const mainSentence = sentences[0] || rawText;

            // 2. 主題（トピック）の抽出（「〜は」「〜とは」「〜が」を検出）
            let topic = title;
            const topicMatch = mainSentence.match(/^([^はとはが]+?)(は|とは|が)/);
            if (topicMatch && topicMatch[1].trim().length < 25) {
                topic = topicMatch[1].trim().replace(/^[「『（\s]+|[」』）\s]+$/g, '');
            }

            // 3. 述語・主張部分の抽出
            let predicate = mainSentence;
            if (topicMatch) {
                predicate = mainSentence.substring(topicMatch[0].length).trim();
            }
            
            // 文末の記号除去と整形
            predicate = predicate.replace(/[。！？\s]+$/, '');
            if (predicate.length > 60) {
                predicate = predicate.substring(0, 57) + "…";
            }

            return {
                topic: topic,
                predicate: predicate || "特定の状態を示している",
                mainSentence: mainSentence.replace(/[。！？\s]+$/, '')
            };
        }

        // -------------------------------------------------------------
        // 動的コンストラクター（抽出された要素に応じた構文生成）
        // -------------------------------------------------------------
        const discourseGenerators = [
            (parsed) => `抽出された『${parsed.topic}』という概念において、それが「${parsed.predicate}」と示される構造に注目されたい。一見すると客観的な定義の体裁を取っているが、この特定の属性のみを選択的に記述すること自体が、不可視の意図による文脈の切り出しを証明している。`,
            (parsed) => `『${parsed.mainSentence}』という提示は、単なる事実の記載ではない。ここで『${parsed.topic}』という要素を前面に配置することで、それと対立する潜在的言説を思考のフレーム外へ排斥する操作が行われている。`,
            (parsed) => `テキスト内で『${parsed.topic}』が「${parsed.predicate}」という形で定着させられている点に、言説の再構築が確認できる。この事実の固定化プロセスこそが、過去の記録の上書きを遮蔽するための遮光膜として機能している。`,
            (parsed) => `『${parsed.topic}』をめぐる「${parsed.predicate}」という言及は、事象そのものの記述ではなく、読者の解釈可能性を制限するための限定的シグナルである。この提示形式そのものを解体しなければならない。`
        ];

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        async function fetchAndInterpret() {
            const btn = document.getElementById('fetch-btn');
            btn.disabled = true;
            btn.innerText = "解析中...";

            try {
                const response = await fetch('https://ja.wikipedia.org/api/rest_v1/page/random/summary');
                const data = await response.json();

                const title = data.title;
                const extract = data.extract || "";

                // 1. 内部NLPアルゴリズムによる構文解析
                const parsed = parseGrammar(title, extract);

                // 2. 解析された文法要素に基づいて解読文を動的構築
                const generator = getRandom(discourseGenerators);
                const interpretationText = generator(parsed);

                // 3. DOM出力
                const scholiumDiv = document.createElement('div');
                scholiumDiv.className = 'scholium';
                scholiumDiv.innerHTML = `
                    <div class="scholium-header">Record #${count} [Source: ${title}]</div>
                    <div class="fetched-quote">
                        <strong>原文引用：</strong>「${extract.substring(0, 90)}${extract.length > 90 ? '…' : ''}」
                    </div>
                    <div class="interpretation">
                        <strong>解読：</strong>${interpretationText}
                    </div>
                    <div class="analysis-debug">
                        [構文解析データ] 主題: "${parsed.topic}" / 抽出述語: "${parsed.predicate}"
                    </div>
                `;

                document.getElementById('scholia-box').appendChild(scholiumDiv);
                count++;

                window.scrollTo({
                    top: document.body.scrollHeight,
                    behavior: 'smooth'
                });

            } catch (error) {
                console.error("Fetch Error:", error);
            } finally {
                btn.disabled = false;
                btn.innerText = "外部テキストを取得・解析";
            }
        }
    </script>
</body>
</html>
