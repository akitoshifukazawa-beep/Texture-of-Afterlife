<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Archive: 自動生成される妄想</title>
    <style>
        :root {
            --bg: #f9f9f8;
            --text: #1a1a1a;
            --muted: #777;
            --border: #dcdcdc;
            --highlight: rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: "游明朝", YuMincho, "ヒラギノ明朝 ProN W3", "Hiragino Mincho ProN", serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 2.2;
            letter-spacing: 0.05em;
            margin: 0;
            padding: 5rem 2rem 10rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        /* 本文（偽りの表面） */
        .manuscript {
            margin-bottom: 4rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--text);
        }

        .manuscript p {
            text-align: justify;
        }

        /* 注釈（自動生成される無限のテキスト） */
        .scholia-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .scholium {
            border-left: 1px solid var(--border);
            padding-left: 2rem;
            font-size: 0.95rem;
            color: var(--text);
            animation: insertFade 0.5s ease forwards;
            opacity: 0;
            transform: translateX(-10px);
        }

        .scholium-header {
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* クリックして増殖させるためのリンク */
        .node {
            cursor: crosshair;
            border-bottom: 1px dashed var(--text);
            transition: background-color 0.2s;
        }

        .node:hover {
            background-color: var(--highlight);
        }
        
        .node.clicked {
            color: var(--muted);
            border-bottom: none;
            cursor: default;
        }

        @keyframes insertFade {
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 最初のテキスト -->
        <div class="manuscript">
            <h2>映像における記憶の改変</h2>
            <p>
                我々がスクリーンを通して目撃するものは、決して客観的な現実ではない。カメラという装置は常に特定のフレームを切り取り、それ以外の世界を隠蔽する。そのとき、観客の脳内で起きているのは事実の受容ではなく、<span class="node" onclick="generateScholium(this, '隠蔽された文脈')">隠蔽された文脈</span>の恣意的な補完である。
            </p>
        </div>

        <!-- 注釈が無限に積み上がるコンテナ -->
        <div class="scholia-container" id="scholia-box"></div>
    </div>

    <script>
        // -------------------------------------------------------------
        // パラノイア・エンジン (Paranoia Generation Engine)
        // 編者が仕組んだ「文脈の自動生成アルゴリズム」
        // -------------------------------------------------------------

        // 語彙の辞書（ランダムに組み合わされるフラグメント）
        const fragments = {
            subjects: [
                "C.K.が執筆したとされる学位論文は、",
                "我々を監視しているあのシステムの構造は、",
                "1998年の冬に彼が私の部屋から持ち去ったノートは、",
                "ゼムブラの雪原に埋められた王の記憶は、",
                "私がこのウェブサイトに密かに埋め込んだコードは、"
            ],
            actions: [
                "表面上は映画理論を装いながら、",
                "アカデミズムの正統性を盾にして、",
                "私の存在そのものを抹消しようとする意図を隠しつつ、",
                "暗号化されたメタファーとして機能し、",
                "全くの無意味な記号の羅列として偽装され、"
            ],
            targets: [
                "私の過去の記憶を冷酷に書き換えている。",
                "彼自身の盗用の罪を告発し続けているのだ。",
                "読者を終わりのないパラノイアの迷宮へと引きずり込む。",
                "真の王位継承者が誰であるかを密かに証明している。",
                "このテキストそのものが一つの罠であることを示している。"
            ],
            // 次のクリックを生み出す「感染性のキーワード」
            triggers: [
                "鏡の錯覚", "失われた手稿", "監視者の足音", "青白い炎", "零度のエクリチュール", "北方の幻影"
            ]
        };

        // ランダムな要素を配列から取得するヘルパー関数
        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // 注釈のカウンター
        let noteCount = 1;

        // クリック時に呼ばれる生成関数
        function generateScholium(element, triggerWord) {
            // 既にクリックされたリンクは無効化
            if (element.classList.contains('clicked')) return;
            element.classList.add('clicked');

            // ランダムに文章を組み立てる
            const subject = getRandom(fragments.subjects);
            const action = getRandom(fragments.actions);
            const target = getRandom(fragments.targets);
            
            // 次なる亀裂（クリッカブルな単語）をランダムに決定
            const nextTrigger = getRandom(fragments.triggers);

            // 文章を結合し、一部に次のリンクを仕込む
            const generatedText = `${subject}${action}${target} だが、彼らが本当に恐れているのは、私が残した <span class="node" onclick="generateScholium(this, '${nextTrigger}')">${nextTrigger}</span> の存在なのだ。`;

            // HTML要素の作成
            const scholiumDiv = document.createElement('div');
            scholiumDiv.className = 'scholium';
            
            scholiumDiv.innerHTML = `
                <div class="scholium-header">Scholium ${noteCount} [Ref: ${triggerWord}]</div>
                <div class="scholium-text">${generatedText}</div>
            `;

            // コンテナの末尾に追加
            document.getElementById('scholia-box').appendChild(scholiumDiv);

            noteCount++;

            // スクロールを一番下へ滑らかに移動（無限の深みへ落ちていく演出）
            window.scrollTo({
                top: document.body.scrollHeight,
                behavior: 'smooth'
            });
        }
    </script>
</body>
</html>
